
name: UNTHINK Autopilot

on:
  workflow_dispatch:

  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Gemini AI SDK
        run: |
          python -m pip install google-genai httpx

      - name: Generate UNTHINK production package
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent.py

      - name: Upload production package
        uses: actions/upload-artifact@v4
        with:
          name: UNTHINK-Production-Package
          path: |
            output/unthink_production_package.md
            output/generation_info.txt
          if-no-files-found: error
          retention-days: 30
